name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bongkar proyek
        run: unzip -o RemotTV.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: RemotTV
        run: gradle :app:assembleRelease --no-daemon

      - name: Siapkan APK
        run: cp RemotTV/app/build/outputs/apk/release/app-release.apk RemotTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RemotTV-apk
          path: RemotTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remot TV build ${{ github.run_number }}
          files: RemotTV.apk
